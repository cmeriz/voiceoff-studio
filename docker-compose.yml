services:
  app:
    build:
      context: .
      target: runtime
    image: voiceoff-studio:latest
    container_name: voiceoff-studio
    ports:
      # Local access only: the app has no authentication.
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - voiceoff-data:/data
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-900}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
    restart: unless-stopped

  test:
    profiles: [test]
    build:
      context: .
      target: test
    image: voiceoff-studio:test

volumes:
  voiceoff-data:
